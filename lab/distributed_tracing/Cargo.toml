[package]
name = "distributed_tracing"
version = "0.1.0"
edition = "2021"

[[bin]]
name = "distributed_tracing"
path = "src/main.rs"

[dependencies]
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "time"] }
